# Kong Gatewayが3系統のRoute/Serviceをフロントする構成（docs/design-brief.md参照）。
# ネットワーク分離の考え方は docs/decisions/0002-mcp-llm-route-network-isolation.md を参照。
# Konnectは使用しない（Gateway単体、Postgres backed）。

networks:
  kong-net:
    name: kong-net
    driver: bridge
  kong-internal:
    name: kong-internal
    driver: bridge
    internal: true

services:
  kong-db:
    image: postgres:17-alpine
    container_name: kong-db
    networks:
      - kong-internal
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: "${KONG_PG_PASSWORD:?KONG_PG_PASSWORD is required}"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  kong-migrations:
    image: kong/kong-gateway-dev:pr-21082-ubuntu
    container_name: kong-migrations
    networks:
      - kong-internal
    command: "kong migrations bootstrap"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD:?KONG_PG_PASSWORD is required}"
      KONG_LICENSE_DATA: "${KONG_LICENSE_DATA:?KONG_LICENSE_DATA is required}"
    depends_on:
      kong-db:
        condition: service_healthy
    restart: on-failure

  kong:
    image: kong/kong-gateway-dev:pr-21082-ubuntu
    container_name: kong
    networks:
      - kong-net
      - kong-internal
    ports:
      # Chat UI/エージェント アクセス用Route（ブラウザから到達する唯一のポート）
      - "8000:8000"
      # Admin API。decK CLIをホスト側から実行するために公開する（ローカル検証専用、本番運用は想定しない）
      - "8001:8001"
      # MCP/LLM Route用の内部専用ポートは意図的にここで公開しない（ADR-0002参照）
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: "${KONG_PG_PASSWORD:?KONG_PG_PASSWORD is required}"
      KONG_LICENSE_DATA: "${KONG_LICENSE_DATA:?KONG_LICENSE_DATA is required}"
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8010"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_LOG_LEVEL: "info"
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  demo-api:
    build:
      context: ./services/demo-api
    container_name: demo-api
    networks:
      - kong-internal
    environment:
      PORT: "3001"
    restart: on-failure
