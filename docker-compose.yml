# Kong Gatewayが3系統のRoute/Serviceをフロントする構成（docs/design-brief.md参照）。
# ネットワーク分離の考え方は docs/decisions/0002-mcp-llm-route-network-isolation.md を参照。
# KongはKonnect管理のself-hosted Data Planeとして起動し、Gateway設定をControl Planeから受信する。

networks:
  kong-net:
    name: kong-net
    driver: bridge
  kong-internal:
    name: kong-internal
    driver: bridge
    internal: true

services:
  kong:
    image: kong/kong-gateway:3.16.0.0
    container_name: kong
    networks:
      - kong-net
      - kong-internal
    ports:
      # Chat UI/エージェント アクセス用Route（ブラウザから到達する唯一のポート）
      - "8000:8000"
      # MCP/LLM Route用の内部専用ポートは意図的にここで公開しない（ADR-0002参照）
    volumes:
      - "${KONNECT_CLUSTER_CERT_PATH:?KONNECT_CLUSTER_CERT_PATH is required}:/etc/kong/cluster/tls.crt:ro"
      - "${KONNECT_CLUSTER_CERT_KEY_PATH:?KONNECT_CLUSTER_CERT_KEY_PATH is required}:/etc/kong/cluster/tls.key:ro"
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: "${KONNECT_CONTROL_PLANE_HOST:?KONNECT_CONTROL_PLANE_HOST is required}:443"
      KONG_CLUSTER_SERVER_NAME: "${KONNECT_CONTROL_PLANE_HOST:?KONNECT_CONTROL_PLANE_HOST is required}"
      KONG_CLUSTER_TELEMETRY_ENDPOINT: "${KONNECT_TELEMETRY_HOST:?KONNECT_TELEMETRY_HOST is required}:443"
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: "${KONNECT_TELEMETRY_HOST:?KONNECT_TELEMETRY_HOST is required}"
      KONG_CLUSTER_CERT: /etc/kong/cluster/tls.crt
      KONG_CLUSTER_CERT_KEY: /etc/kong/cluster/tls.key
      KONG_CLUSTER_DP_LABELS: "deployment:docker-compose,project:kong-azure-obo-demo"
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8010"
      KONG_ADMIN_LISTEN: "off"
      KONG_ADMIN_GUI_LISTEN: "off"
      KONG_LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  demo-api:
    build:
      context: ./services/demo-api
    container_name: demo-api
    networks:
      - kong-internal
    environment:
      PORT: "3001"
    restart: on-failure

  # Chat UI/エージェント（design-brief 4節）。ブラウザから直接到達させず、
  # Kongのkong/login-route.yaml経由でのみアクセスさせる（kong-netには参加させない）。
  chat-ui:
    build:
      context: ./services/chat-ui
    container_name: chat-ui
    networks:
      - kong-internal
    environment:
      PORT: "3000"
      # このコンテナ自身からKongのMCP/LLM Routeを呼ぶ際のベースURL（kong-internal経由）。
      KONG_INTERNAL_BASE_URL: "http://kong:8000"
    depends_on:
      kong:
        condition: service_healthy
    restart: on-failure
