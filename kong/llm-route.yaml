# LLM（Azure OpenAI）アクセス用Route（docs/design-brief.md 3節「Kong側のプラグインチェーン」3番目）。
# Next.jsエージェント（サーバーサイド）のみが呼び出す経路。追加認証は掛けず、
# Docker Compose上のネットワーク到達性で保護する想定（実際の制約はdocs/decisions/0002参照）。
#
# ai-proxy-advancedがAzure OpenAIの認証情報・エンドポイント詳細を保持し、
# エージェント側には抽象化されたエンドポイントを提供する（design-brief 3節）。
# Serviceのhost/portはai-proxy-advancedが実際の宛先を上書きするため使われないプレースホルダ
# （kong-ee/spec-ee/03-plugins/44-ai-proxy-advanced/配下のテストも同様にplaceholderを使う）。
_format_version: "3.0"
services:
  - name: azure-openai
    protocol: https
    host: localhost
    port: 443
    routes:
      - name: llm
        protocols:
          - http
        paths:
          - /llm
        plugins:
          - name: ai-proxy-advanced
            config:
              targets:
                - route_type: llm/v1/chat
                  auth:
                    header_name: api-key
                    header_value: "${{ env "DECK_AZURE_OPENAI_API_KEY" }}"
                  model:
                    provider: azure
                    name: "${{ env "DECK_AZURE_OPENAI_DEPLOYMENT_NAME" }}"
                    # エージェント側はAzureのデプロイ名を一切知らず、常にこの固定値のみを
                    # "model"としてリクエストに含める（design-brief 2節、検証方法9番目の要件）。
                    # kong-ee/kong/llm/plugin/shared-filters/normalize-request.luaの実装を確認済み:
                    # request.modelが model.name と一致しなくてもmodel_aliasと一致すれば通る。
                    model_alias: kong-demo-llm
                    options:
                      azure_instance: "${{ env "DECK_AZURE_OPENAI_INSTANCE_NAME" }}"
                      azure_deployment_id: "${{ env "DECK_AZURE_OPENAI_DEPLOYMENT_NAME" }}"
                      # 要検証: terraform/azure_openai.tf適用時点(2026-08)のAPIバージョン。
                      # 実際にdeck syncする際、Azure OpenAI側で有効なapi-versionか要確認
                      # （docs/troubleshooting-log.md参照）。
                      azure_api_version: "2024-10-21"
                  # 要検証で判明: loggingはconfig直下ではなくtargets[]要素の中に置く必要がある
                  # （kong-ee/kong/plugins/ai-proxy-advanced/schema.lua:270、実機のスキーマエラーで発覚。
                  # docs/troubleshooting-log.md参照）。
                  logging:
                    log_statistics: true
                    log_payloads: false
